services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solyaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solyaris}
      POSTGRES_DB: ${POSTGRES_DB:-solyaris}
    ports:
      - "5432:5432"
    volumes:
      - solyaris_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solyaris} -d ${POSTGRES_DB:-solyaris}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-solyaris}:${POSTGRES_PASSWORD:-solyaris}@db:5432/${POSTGRES_DB:-solyaris}
      BACKEND_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./backend/fixtures:/app/fixtures

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  solyaris_pg:
